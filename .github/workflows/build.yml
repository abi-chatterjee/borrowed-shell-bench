# Builds every variant on each target OS/arch, runs each variant's smoke check, and uploads
# dist/<os>-<arch>/ as an artifact. The "dist" job collects them into one downloadable zip.
#
# Hosted Windows runners are Windows Server images. They build and smoke-test here, but they
# do not substitute for measuring on Windows 10 and Windows 11 (see docs/method.md).
# Nothing here is signed.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '24'
  GO_VERSION: '1.25'

jobs:
  linux-tests:
    name: linux unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: System libraries for the Tauri compile check
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Python test dependencies
        run: python -m pip install -r bench/requirements.txt
      - name: Python server and store tests
        working-directory: bshell/py
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests
      - name: Node server and store tests
        working-directory: bshell/node
        run: npm test
      - name: Go store tests (Wails variant)
        working-directory: variants/wails
        run: go test ./store/...
      - name: Harness, report and PowerShell static tests
        run: python -m unittest discover -s bench/tests
      - name: Shared frontend integrity
        run: python scripts/check_frontend.py --all
      - name: Tauri store tests
        run: |
          BENCH_VARIANTS=tauri BENCH_SKIP_SMOKE=1 sh scripts/build_all.sh
          cd build/linux-x64/tauri/src-tauri && cargo test

  build:
    name: build ${{ matrix.label }}
    needs: linux-tests
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            runner: macos-15
            shell: sh
          # Intel macOS: GitHub's current label. GitHub has announced Intel macOS support ends
          # when the macOS 15 image is retired (fall 2027). If this label stops resolving, run
          # scripts/build_all.sh on an Intel Mac; the scripts are the same.
          - label: macos-x64
            runner: macos-15-intel
            shell: sh
          - label: windows-x64
            runner: windows-2025
            shell: powershell
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Print toolchain versions
        run: |
          python --version
          node --version
          npm --version
          go version
          cargo --version
          rustc --version
      - name: Install the Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Build all variants and run smoke checks (macOS)
        if: runner.os == 'macOS'
        run: |
          PATH="$(go env GOPATH)/bin:$PATH"
          export PYTHON=python3
          sh scripts/build_all.sh
      - name: Build all variants and run smoke checks (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:PATH = (go env GOPATH) + '\bin;' + $env:PATH
          .\scripts\build_all.ps1
      # Measure on the hosted runner itself. Hosted runners are shared VMs, so the numbers are
      # for comparing variants on the same runner, not absolute figures. A failure here must
      # not hide a good build, so the step may fail without failing the job.
      - name: Benchmark on this runner (5 runs, 20 s idle)
        continue-on-error: true
        run: |
          python -m pip install --quiet --disable-pip-version-check -r bench/requirements.txt
          python bench/run.py --variants all --runs 5 --idle-seconds 20 --no-quiet-check --out results/ci-${{ matrix.label }}.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-${{ matrix.label }}
          path: results/ci-${{ matrix.label }}.json
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dist-${{ matrix.label }}
          path: dist/${{ matrix.label }}/
          if-no-files-found: error
          retention-days: 30

  report:
    name: benchmark report
    needs: build
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          pattern: results-*
          path: results
          merge-multiple: true
      - name: Summarise
        run: |
          ls -l results
          python -m pip install --quiet --disable-pip-version-check -r bench/requirements.txt
          python bench/report.py results/ci-*.json --out results/summary.md
          cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-report
          path: results/
          retention-days: 90

  dist:
    name: collect dist
    needs: build
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
      - name: Zip everything into one file
        run: |
          cd dist
          zip -qr ../borrowed-shell-bench-dist.zip .
          ls -l ../borrowed-shell-bench-dist.zip
      - uses: actions/upload-artifact@v7
        with:
          name: borrowed-shell-bench-dist
          path: borrowed-shell-bench-dist.zip
          retention-days: 30
